services:
  db:
    image: postgres:18-alpine
    container_name: spechub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spechub}
      POSTGRES_USER: ${POSTGRES_USER:-spechub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spechub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG18+: a volume-t a /var/lib/postgresql alá kell mountolni
      # (az image verziózott alkönyvtárba teszi az adatot, pl. 18/main).
      # A régi /var/lib/postgresql/data mount-tal az image el sem indul.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-spechub} -d $${POSTGRES_DB:-spechub}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
